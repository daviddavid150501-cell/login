<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CRUD Application</title>
    <style>
        * { 
            box-sizing: border-box;
             font-family: Arial, sans-serif;
              margin: 0; padding: 0; 
            }
        body { 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container {
             background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        .container.dashboard-mode {
             max-width: 800px; 
            }
        h2 {
             margin-bottom: 20px;
             color: #333; 
             text-align: center; 
            }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #667; 
        }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            border: none; 
            border-radius: 4px; 
            color: white; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover {
             background-color: #0056b3; 
            }
        .error-msg { 
            color: #dc3545;
             margin-bottom: 15px;
              text-align: center; 
              font-size: 14px;
               display: none; 
            }
        .hidden {
             display: none !important; 
            }
        .header-actions {
             display: flex;
             justify-content: space-between;
              align-items: center; 
              margin-bottom: 20px;
             }
        .logout-btn { 
            background-color: #6c757d;
             width: auto;
              padding: 8px 15px; 
              font-size: 14px; 
            }
        .crud-form { 
            background: #f8f9fa;
             padding: 15px; 
             border-radius: 6px; 
             margin-bottom: 20px; 
             border: 1px solid #e9ecef;
             }
        .crud-form-row {
             display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
        }
        .crud-form-row input { flex: 1; }
        .crud-btn-group {
             display: flex;
             gap: 10px; 
            }
        .cancel-btn { 
            background-color: #e2e3e5; 
            color: #383d41;
         }
        table { 
            width: 100%; 
            border-collapse: collapse;
             margin-top: 10px; 
            }
        th, td {
             padding: 12px; 
            text-align: left; 
            border-bottom: 1px solid #dee2e6;
         }
        th { 
            background-color: #e9ecef; 
            color: #495057; 
        }
        .action-btns { 
            display: flex;
             gap: 5px; 
            }
        .edit-btn { 
            background-color: #ffc107;
             color: #000; width: auto; 
             padding: 5px 10px;
              font-size: 13px; 
            }
        .delete-btn { 
            background-color: #dc3545; 
            width: auto; 
            padding: 5px 10px; 
            font-size: 13px;
         }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <div id="loginView">
            <h2>Account Login</h2>
            <div class="error-msg" id="loginError">Invalid username or password!</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
                <button type="submit">Sign In</button>
            </form>
        </div>
        <div id="dashboardView" class="hidden">
            <div class="header-actions">
                <h2>User Dashboard</h2>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
            <div class="crud-form">
                <h3 id="formTitle">Create New User</h3>
                <input type="hidden" id="editIndex">
                <div class="crud-form-row">
                    <input type="text" id="crudUsername" placeholder="Username" required>
                    <input type="text" id="crudPassword" placeholder="Password" required>
                </div>
                <div class="crud-btn-group">
                    <button id="saveBtn" onclick="saveUser()">Add User</button>
                    <button id="cancelBtn" class="cancel-btn hidden" onclick="resetCrudForm()">Cancel</button>
                </div>
            </div>
            <table>
                <thead><tr><th>Username</th><th>Password</th><th>Actions</th></tr></thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([{ username: 'Admin', password: 'admin123' }]));
        }
        const appContainer = document.getElementById('appContainer');
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const userTableBody = document.getElementById('userTableBody');
        
        function handleLogin(event) {
            event.preventDefault();
            const users = JSON.parse(localStorage.getItem('users'));
            const matched = users.find(u => u.username.toLowerCase() === document.getElementById('username').value.trim().toLowerCase() && u.password === document.getElementById('password').value.trim());
            if (matched) {
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('loginForm').reset();
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                appContainer.classList.add('dashboard-mode');
                loadTableData();
            } else { document.getElementById('loginError').style.display = 'block'; }
        }
        function handleLogout() {
            dashboardView.classList.add('hidden');
            loginView.classList.remove('hidden');
            appContainer.classList.remove('dashboard-mode');
            resetCrudForm();
        }
        function loadTableData() {
            const users = JSON.parse(localStorage.getItem('users'));
            userTableBody.innerHTML = '';
            users.forEach((u, i) => {
                userTableBody.innerHTML += `<tr><td>${u.username}</td><td>••••••••</td><td class="action-btns"><button class="edit-btn" onclick="setupEdit(${i})">Edit</button><button class="delete-btn" onclick="deleteUser(${i})">Delete</button></td></tr>`;
            });
        }
        function saveUser() {
            const name = document.getElementById('crudUsername').value.trim();
            const pass = document.getElementById('crudPassword').value.trim();
            const idx = document.getElementById('editIndex').value;
            if (!name || !pass) return alert('Fill both fields.');
            let users = JSON.parse(localStorage.getItem('users'));
            if (idx === "") users.push({ username: name, password: pass });
            else users[idx] = { username: name, password: pass };
            localStorage.setItem('users', JSON.stringify(users));
            resetCrudForm(); loadTableData();
        }
        function setupEdit(i) {
            const u = JSON.parse(localStorage.getItem('users'))[i];
            document.getElementById('crudUsername').value = u.username;
            document.getElementById('crudPassword').value = u.password;
            document.getElementById('editIndex').value = i;
            document.getElementById('formTitle').innerText = "Update User";
            document.getElementById('saveBtn').innerText = "Update";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }
        function deleteUser(i) {
            let users = JSON.parse(localStorage.getItem('users'));
            if (users.length === 1) return alert("Cannot delete final user.");
            users.splice(i, 1);
            localStorage.setItem('users', JSON.stringify(users));
            resetCrudForm(); loadTableData();
        }
        function resetCrudForm() {
            document.getElementById('crudUsername').value = '';
            document.getElementById('crudPassword').value = '';
            document.getElementById('editIndex').value = '';
            document.getElementById('formTitle').innerText = "Create New User";
            document.getElementById('saveBtn').innerText = "Add User";
            document.getElementById('cancelBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
